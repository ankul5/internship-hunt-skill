name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Link skills and create an empty private data folder
        run: bash scripts/setup.sh
      - name: Structural checks
        run: node tests/validate.mjs
      - name: Tests
        run: node --test tests/*.test.mjs
