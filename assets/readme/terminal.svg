<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 522" width="900" height="522" role="img" aria-labelledby="t d">
<title id="t">A session in Claude Code</title>
<desc id="d">A fictional session. /run-search records 38 new listings from freehire.me, one from employer boards, suggests 29 startup boards and skips 40 templated pages. The user approves job-0021. /apply quotes nine requirements from the posting, makes the resume and cover letter PDFs in the harvard template and keeps a gap honest. /submit-application shows the destination and files, then waits for the user's yes.</desc>
