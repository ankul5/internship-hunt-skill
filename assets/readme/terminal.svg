✓</text><text x="78" y="267" class="m">shortlisted  note: "approve job-0021"</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.3889;0.3972;.97;1"/><text x="34" y="292" class="p">❯</text></g><text x="56" y="292" class="c" clip-path="url(#c8)">/apply job-0021</text><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.4556;0.4639;.97;1"/><text x="56" y="317" class="g">✓</text><text x="78" y="317" class="m">9 requirements quoted from the posting</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.4778;0.4861;.97;1"/><text x="56" y="342" class="g">✓</text><text x="78" y="342" class="m">resume.pdf + cover-letter.pdf   template: harvard   1 page</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.5000;0.5083;.97;1"/><text x="56" y="367" class="w">!</text><text x="78" y="367" class="m">gap kept honest: no IoT project is claimed</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.5778;0.5861;.97;1"/><text x="34" y="392" class="p">❯</text></g><text x="56" y="392" class="c" clip-path="url(#c12)">/submit-application app-0001</text><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.6444;0.6528;.97;1"/><text x="56" y="417" class="m"> </text><text x="78" y="417" class="m">Destination  careers.example.com/apply/1234</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.6667;0.6750;.97;1"/><text x="56" y="442" class="m"> </text><text x="78" y="442" class="m">Files        resume.pdf, cover-letter.pdf   Answers 3   Declarations 1</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.7000;0.7083;.97;1"/><text x="56" y="467" class="a">?</text><text x="78" y="467" class="q">Submit this exact package to this destination?</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.7222;0.7306;.97;1"/><rect x="539.2" y="450" width="164" height="24" rx="5" fill="#2a1a1d" stroke="#7a1f2b"/><text x="551.2" y="467" class="q">waiting for yes</text></g><rect x="56" y="479" width="10" height="19" fill="#d4a94a" opacity="0"><animate attributeName="opacity" values="0;0;1;0;1;0;1;0" keyTimes="0;0.7333;0.7667;0.8000;0.8333;0.8667;0.9000;1" dur="18s" repeatCount="indefinite"/></rect>
