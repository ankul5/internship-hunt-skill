<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d">
  <title id="t">Every listing is checked before you see it</title>
  <desc id="d">On the left, a legend: verified means the employer's own page was read, match is the score against your confirmed profile, expired means closed, skipped means a templated page that is not job evidence. On the right, a job board is scanned from top to bottom and each listing is stamped in turn; the matched listing then waits for your approval.</desc>
  <defs>
    <radialGradient id="glow" cx="22%" cy="45%" r="55%"><stop offset="0" stop-color="#7a1f2b" stop-opacity=".45"/><stop offset="1" stop-color="#7a1f2b" stop-opacity="0"/></radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b8fd6" stop-opacity="0"/><stop offset="1" stop-color="#5b8fd6" stop-opacity=".35"/></linearGradient>
    <clipPath id="board"><rect x="690" y="58" width="460" height="352" rx="18"/></clipPath>
    <style>
      .ttl{font:700 54px Georgia,'Times New Roman',serif;fill:#f5efe2}
      .tag{font:400 19px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#a8a29e}
      .job{font:600 16px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#ece6da}
      .meta{font:400 13px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#8a847c}
      .hdr{font:700 12px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#8a847c;letter-spacing:.08em}
      .stamp{font:800 12px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;letter-spacing:.06em;text-anchor:middle}
    </style>
  </defs>

  <rect width="1200" height="480" rx="22" fill="#0e0e12"/>
  <rect width="1200" height="480" rx="22" fill="url(#glow)"/>

  <!-- left: what the stamps mean -->
  <text x="70" y="118" class="ttl" style="font-size:40px">Every listing is checked</text>
  <text x="70" y="166" class="ttl" style="font-size:40px">before you see it.</text>
  <rect x="72" y="188" width="64" height="4" rx="2" fill="#d4a94a"/>
  <g transform="translate(70,226)">
    <rect width="98" height="26" rx="13" fill="none" stroke="#5b8fd6" stroke-width="2"/><text x="49" y="18" class="stamp" style="fill:#7fa8e3">✓ VERIFIED</text>
    <text x="116" y="18" class="tag" style="font-size:16px">the employer's own page was read</text>
  </g>
  <g transform="translate(70,266)">
    <rect width="98" height="26" rx="13" fill="#d4a94a"/><text x="49" y="18" class="stamp" style="fill:#1a1408">MATCH 82</text>
    <text x="116" y="18" class="tag" style="font-size:16px">scored against your confirmed profile</text>
  </g>
  <g transform="translate(70,306)">
    <rect width="98" height="26" rx="13" fill="none" stroke="#6b6670" stroke-width="2"/><text x="49" y="18" class="stamp" style="fill:#8a847c">EXPIRED</text>
    <text x="116" y="18" class="tag" style="font-size:16px">closed or gone: never shown as open</text>
  </g>
  <g transform="translate(70,346)">
    <rect width="98" height="26" rx="13" fill="none" stroke="#a3394a" stroke-width="2"/><text x="49" y="18" class="stamp" style="fill:#d06a7a">SKIPPED</text>
    <text x="116" y="18" class="tag" style="font-size:16px">templated pages are not job evidence</text>
  </g>

  <!-- the board -->
  <rect x="690" y="58" width="460" height="352" rx="18" fill="#16161c" stroke="#2a2a33"/>
  <text x="716" y="90" class="hdr">TODAY'S BOARD</text>
  <circle cx="1120" cy="86" r="4" fill="#5b8fd6"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle>

  <g id="c1">
    <rect x="712" y="108" width="416" height="64" rx="12" fill="#1d1d25"/>
    <rect x="728" y="122" width="36" height="36" rx="9" fill="#3b6fb6"/><text x="746" y="146" class="job" text-anchor="middle" fill="#fff" style="fill:#fff">E</text>
    <text x="778" y="136" class="job">Full Stack Intern</text><text x="778" y="156" class="meta">Example Labs · Remote</text>
  </g>
  <g>
    <rect x="712" y="184" width="416" height="64" rx="12" fill="#1d1d25"><animate attributeName="opacity" values="1;1;.45;.45;1" keyTimes="0;.22;.25;.95;1" dur="9s" repeatCount="indefinite"/></rect>
    <rect x="728" y="198" width="36" height="36" rx="9" fill="#55505a"/><text x="746" y="222" class="job" text-anchor="middle" style="fill:#fff">A</text>
    <text x="778" y="212" class="job">SDE Intern</text><text x="778" y="232" class="meta">Acme Robotics · closed</text>
    <line x1="778" y1="207" x2="860" y2="207" stroke="#8a847c" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.22;.25;.95;1" dur="9s" repeatCount="indefinite"/></line>
  </g>
  <g>
    <rect x="712" y="260" width="416" height="64" rx="12" fill="#1d1d25" stroke="#d4a94a" stroke-opacity="0" stroke-width="2"><animate attributeName="stroke-opacity" values="0;0;1;.4;1;1;0" keyTimes="0;.6;.63;.7;.77;.95;1" dur="9s" repeatCount="indefinite"/></rect>
    <rect x="728" y="274" width="36" height="36" rx="9" fill="#7a1f2b"/><text x="746" y="298" class="job" text-anchor="middle" style="fill:#fff">B</text>
    <text x="778" y="288" class="job">ML Intern</text><text x="778" y="308" class="meta">Brightwave AI · Hybrid</text>
  </g>
  <g>
    <rect x="712" y="336" width="416" height="56" rx="12" fill="#1d1d25"><animate attributeName="opacity" values="1;1;.45;.45;1" keyTimes="0;.47;.5;.95;1" dur="9s" repeatCount="indefinite"/></rect>
    <rect x="728" y="346" width="36" height="36" rx="9" fill="#3a3a44"/><text x="746" y="370" class="job" text-anchor="middle" style="fill:#fff">?</text>
    <text x="778" y="360" class="job">"Software Intern, 50K/mo"</text><text x="778" y="380" class="meta">listing site · no employer link</text>
  </g>

  <!-- scanning beam -->
  <g clip-path="url(#board)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 300;0 300" keyTimes="0;.04;.52;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.5;.54;1" dur="9s" repeatCount="indefinite"/>
      <rect x="690" y="60" width="460" height="46" fill="url(#scan)"/>
      <rect x="690" y="104" width="460" height="2.5" fill="#5b8fd6"/>
    </g>
  </g>

  <!-- stamps -->
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.1;.12;.95;1" dur="9s" repeatCount="indefinite"/>
    <rect x="1012" y="127" width="98" height="26" rx="13" fill="none" stroke="#5b8fd6" stroke-width="2"/><text x="1061" y="145" class="stamp" style="fill:#7fa8e3">✓ VERIFIED</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.22;.25;.95;1" dur="9s" repeatCount="indefinite"/>
    <rect x="1012" y="203" width="98" height="26" rx="13" fill="none" stroke="#6b6670" stroke-width="2"/><text x="1061" y="221" class="stamp" style="fill:#8a847c">EXPIRED</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.35;.38;.95;1" dur="9s" repeatCount="indefinite"/>
    <rect x="1012" y="279" width="98" height="26" rx="13" fill="#d4a94a"/><text x="1061" y="297" class="stamp" style="fill:#1a1408">MATCH 82</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.47;.5;.95;1" dur="9s" repeatCount="indefinite"/>
    <rect x="1012" y="351" width="98" height="26" rx="13" fill="none" stroke="#a3394a" stroke-width="2"/><text x="1061" y="369" class="stamp" style="fill:#d06a7a">SKIPPED</text></g>

  <!-- approval prompt on the match -->
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.63;.66;.95;1" dur="9s" repeatCount="indefinite"/>
    <rect x="896" y="420" width="254" height="30" rx="15" fill="#2a1a1d" stroke="#7a1f2b"/>
    <text x="1023" y="440" class="stamp" style="fill:#e8d5a6;font-weight:700;letter-spacing:.02em">approve ML Intern?  waiting for you</text>
  </g>
</svg>
