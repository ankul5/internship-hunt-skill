<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
  <title id="t">Internship Hunt</title>
  <desc id="d">A resume card travels along a route through five stations: search, verify, score, tailor and your approval. Each station lights up as the card arrives, and a check mark appears at the end.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16233b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <path id="route" d="M110 330 C 230 250, 340 385, 450 320 C 505 288, 545 285, 600 285 C 655 285, 695 288, 750 320 C 870 390, 975 370, 1090 300"/>
    <style>
      .title{font:800 58px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#f8fafc;letter-spacing:-1px}
      .tag{font:400 21px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#94a3b8}
      .lbl{font:600 15px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#cbd5e1;text-anchor:middle}
      .node{fill:#0f1a2e;stroke:#334155;stroke-width:3}
    </style>
  </defs>

  <rect width="1200" height="440" rx="22" fill="url(#bg)"/>
  <g fill="#60a5fa">
    <circle cx="140" cy="60" r="2"><animate attributeName="opacity" values="0;.8;0" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="985" cy="72" r="2.4"><animate attributeName="opacity" values="0;.8;0" dur="6s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="165" r="1.8"><animate attributeName="opacity" values="0;.8;0" dur="4.5s" begin="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="205" r="1.8"><animate attributeName="opacity" values="0;.8;0" dur="5.5s" begin="3.4s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="112" text-anchor="middle" class="title">Internship <tspan fill="url(#accent)">Hunt</tspan></text>
  <text x="600" y="152" text-anchor="middle" class="tag">Find, verify, tailor and track internships from Claude Code.</text>
  <text x="600" y="182" text-anchor="middle" class="tag">Your data stays on your machine. Nothing is sent without your yes.</text>

  <!-- route: dotted track, then the drawn line that follows the card -->
  <use href="#route" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
  <path d="M110 330 C 230 250, 340 385, 450 320 C 505 288, 545 285, 600 285 C 655 285, 695 288, 750 320 C 870 390, 975 370, 1090 300" pathLength="1" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 1">
    <animate attributeName="stroke-dashoffset" dur="10s" repeatCount="indefinite" values="1;1;.6565;.6565;.5042;.5042;.3518;.3518;0;0" keyTimes="0;.04;.22;.26;.34;.38;.46;.50;.70;1"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0" keyTimes="0;.95;1"/>
  </path>

  <!-- stations: dot lights on arrival, ring pings -->
  <g>
    <circle class="node" cx="110" cy="330" r="17"/>
    <circle cx="110" cy="330" r="7" fill="#2dd4bf"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;.25" keyTimes="0;.95;1"/></circle>
    <circle cx="110" cy="330" r="20" fill="none" stroke="#2dd4bf" stroke-width="3"><animate attributeName="r" dur="10s" repeatCount="indefinite" values="18;36;36" keyTimes="0;.08;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;0;0" keyTimes="0;.08;1"/></circle>
    <text x="110" y="378" class="lbl">Search</text>
  </g>
  <g>
    <circle class="node" cx="450" cy="320" r="17"/>
    <circle cx="450" cy="320" r="7" fill="#2dd4bf" opacity=".25"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values=".25;.25;1;1;.25" keyTimes="0;.22;.23;.95;1"/></circle>
    <circle cx="450" cy="320" r="18" fill="none" stroke="#2dd4bf" stroke-width="3" opacity="0"><animate attributeName="r" dur="10s" repeatCount="indefinite" values="18;18;36;36" keyTimes="0;.22;.30;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;.219;.22;.30;1"/></circle>
    <text x="450" y="368" class="lbl">Verify</text>
  </g>
  <g>
    <circle class="node" cx="600" cy="285" r="17"/>
    <circle cx="600" cy="285" r="7" fill="#2dd4bf" opacity=".25"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values=".25;.25;1;1;.25" keyTimes="0;.34;.35;.95;1"/></circle>
    <circle cx="600" cy="285" r="18" fill="none" stroke="#2dd4bf" stroke-width="3" opacity="0"><animate attributeName="r" dur="10s" repeatCount="indefinite" values="18;18;36;36" keyTimes="0;.34;.42;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;.339;.34;.42;1"/></circle>
    <text x="600" y="333" class="lbl">Score</text>
  </g>
  <g>
    <circle class="node" cx="750" cy="320" r="17"/>
    <circle cx="750" cy="320" r="7" fill="#2dd4bf" opacity=".25"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values=".25;.25;1;1;.25" keyTimes="0;.46;.47;.95;1"/></circle>
    <circle cx="750" cy="320" r="18" fill="none" stroke="#2dd4bf" stroke-width="3" opacity="0"><animate attributeName="r" dur="10s" repeatCount="indefinite" values="18;18;36;36" keyTimes="0;.46;.54;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;.459;.46;.54;1"/></circle>
    <text x="750" y="368" class="lbl">Tailor</text>
  </g>
  <g>
    <circle class="node" cx="1090" cy="300" r="17"/>
    <text x="1090" y="358" class="lbl">You approve</text>
  </g>

  <!-- the travelling resume card -->
  <g>
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;.3435;.3435;.4958;.4958;.6482;.6482;1;1" keyTimes="0;.04;.22;.26;.34;.38;.46;.50;.70;1"><mpath href="#route"/></animateMotion>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;.70;.72;1"/>
    <g transform="translate(-19,-56)">
      <rect width="38" height="48" rx="5" fill="#f8fafc"/>
      <rect x="7" y="8" width="24" height="4" rx="2" fill="#0f172a"/>
      <rect x="7" y="17" width="18" height="3" rx="1.5" fill="#94a3b8"/>
      <rect x="7" y="24" width="22" height="3" rx="1.5" fill="#94a3b8"/>
      <rect x="7" y="31" width="16" height="3" rx="1.5" fill="#94a3b8"/>
      <rect x="7" y="38" width="20" height="3" rx="1.5" fill="#2dd4bf"/>
    </g>
  </g>

  <!-- approval check -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.70;.73;.94;1"/>
    <circle cx="1090" cy="300" r="26" fill="#2dd4bf"/>
    <path d="M1078 300 l8 8 l16 -18" fill="none" stroke="#0b1220" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
