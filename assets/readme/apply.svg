<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">How /apply keeps it honest</title>
  <desc id="d">Facts from the posting and from your confirmed profile drop through a fact-check sieve. Facts that check out fall through and become lines on the resume. A made-up claim, "led a team of 10", is stopped by the sieve, marked with a cross and thrown out. The finished resume is stamped one page with real text, and waits for your review.</desc>
  <defs>
    <clipPath id="fall"><rect x="380" y="60" width="360" height="250"/></clipPath>
    <style>
      .h{font:700 24px Georgia,'Times New Roman',serif;fill:#f5efe2}
      .lab{font:700 15px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#ece6da;text-anchor:middle}
      .sm{font:400 12.5px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#8a847c;text-anchor:middle}
      .chip{font:600 13px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;text-anchor:middle}
      .flow{fill:none;stroke:#3a3a44;stroke-width:2.5;stroke-dasharray:5 9;animation:f 1.1s linear infinite}
      @keyframes f{to{stroke-dashoffset:-14}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="20" fill="#0e0e12"/>
  <text x="32" y="52" class="h">How /apply keeps it honest</text>
  <rect x="34" y="64" width="44" height="3" rx="1.5" fill="#d4a94a"/>

  <!-- sources -->
  <g transform="translate(90,110)">
    <rect width="150" height="80" rx="12" fill="#1c1c24" stroke="#2a2a33"/><rect x="14" y="14" width="30" height="38" rx="4" fill="#5b8fd6"/>
    <rect x="54" y="18" width="80" height="6" rx="3" fill="#3a3a44"/><rect x="54" y="32" width="64" height="6" rx="3" fill="#3a3a44"/><rect x="54" y="46" width="72" height="6" rx="3" fill="#3a3a44"/>
    <text x="75" y="100" class="lab">The posting</text><text x="75" y="117" class="sm">re-read and saved</text>
  </g>
  <g transform="translate(90,244)">
    <rect width="150" height="80" rx="12" fill="#1c1c24" stroke="#2a2a33"/><rect x="14" y="14" width="30" height="38" rx="4" fill="#8c2333"/>
    <rect x="54" y="18" width="80" height="6" rx="3" fill="#3a3a44"/><rect x="54" y="32" width="64" height="6" rx="3" fill="#3a3a44"/><rect x="54" y="46" width="72" height="6" rx="3" fill="#3a3a44"/>
  </g>
  <text x="165" y="332" class="lab">Your profile</text><text x="165" y="350" class="sm" style="font-size:11.5px">confirmed facts only</text>
  <path class="flow" d="M240 150 C 320 150, 330 95, 420 95"/>
  <path class="flow" d="M240 284 C 330 284, 330 95, 420 95"/>

  <!-- falling chips (behind the sieve) -->
  <g clip-path="url(#fall)">
    <g opacity="0"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 200;0 200" keyTimes="0;.06;.2;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.06;.07;.17;.2;1" dur="8s" repeatCount="indefinite"/>
      <rect x="490" y="76" width="140" height="30" rx="15" fill="#1d2a40" stroke="#5b8fd6"/><text x="560" y="96" class="chip" style="fill:#a9c4ec">Node.js (profile)</text></g>
    <g opacity="0"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 200;0 200" keyTimes="0;.22;.36;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.22;.23;.33;.36;1" dur="8s" repeatCount="indefinite"/>
      <rect x="470" y="76" width="180" height="30" rx="15" fill="#2a2416" stroke="#d4a94a"/><text x="560" y="96" class="chip" style="fill:#e8d5a6">"Proficiency with Node.js"</text></g>
    <g opacity="0"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 52;0 52;-30 -10;-30 -10" keyTimes="0;.40;.47;.55;.62;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.40;.41;.58;.62;1" dur="8s" repeatCount="indefinite"/>
      <rect x="485" y="76" width="150" height="30" rx="15" fill="#3a1218" stroke="#d06a7a"/><text x="560" y="96" class="chip" style="fill:#f0b6bf">"led a team of 10"</text></g>
    <g opacity="0"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 200;0 200" keyTimes="0;.62;.76;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.62;.63;.73;.76;1" dur="8s" repeatCount="indefinite"/>
      <rect x="480" y="76" width="160" height="30" rx="15" fill="#1d2a40" stroke="#5b8fd6"/><text x="560" y="96" class="chip" style="fill:#a9c4ec">PostgreSQL migration</text></g>
  </g>

  <!-- the sieve -->
  <g>
    <path d="M440 160 H680 L600 250 H520 Z" fill="#7a1f2b" fill-opacity=".22" stroke="#7a1f2b" stroke-width="2.5"/>
    <g stroke="#a3394a" stroke-width="3" stroke-linecap="round">
      <line x1="440" y1="160" x2="680" y2="160"/>
      <line x1="460" y1="156" x2="460" y2="164"/><line x1="490" y1="156" x2="490" y2="164"/><line x1="520" y1="156" x2="520" y2="164"/><line x1="550" y1="156" x2="550" y2="164"/>
      <line x1="580" y1="156" x2="580" y2="164"/><line x1="610" y1="156" x2="610" y2="164"/><line x1="640" y1="156" x2="640" y2="164"/><line x1="670" y1="156" x2="670" y2="164"/>
    </g>
    <text x="560" y="210" class="lab" style="fill:#f0d9dc">Fact check</text>
    <text x="560" y="228" class="sm" style="fill:#c9a7ab">no new numbers, tools or verbs</text>
  </g>
  <!-- rejection mark -->
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.47;.48;.58;.62;1" dur="8s" repeatCount="indefinite"/>
    <circle cx="700" cy="140" r="15" fill="#d06a7a"/><path d="M694 134 l12 12 M706 134 l-12 12" stroke="#0e0e12" stroke-width="3" stroke-linecap="round"/>
    <text x="700" y="116" class="sm" style="fill:#f0b6bf">refused: not in your profile</text>
  </g>

  <path class="flow" d="M560 252 C 560 300, 700 300, 820 260" style="stroke:#5b8fd6;stroke-opacity:.6"/>

  <!-- resume being written -->
  <g transform="translate(830,100)">
    <rect width="190" height="230" rx="10" fill="#f5efe2"/>
    <rect x="20" y="20" width="110" height="10" rx="3" fill="#2a1418"/><rect x="20" y="38" width="150" height="4" rx="2" fill="#b9ae9a"/>
    <rect x="20" y="56" width="70" height="6" rx="2" fill="#7a1f2b"/>
    <rect x="20" y="72" width="150" height="5" rx="2.5" fill="#6f665a" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.2;.22;.95;1" dur="8s" repeatCount="indefinite"/></rect>
    <rect x="20" y="86" width="130" height="5" rx="2.5" fill="#6f665a" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.36;.38;.95;1" dur="8s" repeatCount="indefinite"/></rect>
    <rect x="20" y="110" width="70" height="6" rx="2" fill="#7a1f2b"/>
    <rect x="20" y="126" width="145" height="5" rx="2.5" fill="#6f665a" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.76;.78;.95;1" dur="8s" repeatCount="indefinite"/></rect>
    <rect x="20" y="140" width="110" height="5" rx="2.5" fill="#6f665a" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.78;.8;.95;1" dur="8s" repeatCount="indefinite"/></rect>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.82;.85;.95;1" dur="8s" repeatCount="indefinite"/>
      <g transform="rotate(-8 95 190)"><rect x="30" y="172" width="130" height="34" rx="6" fill="none" stroke="#d4a94a" stroke-width="3"/><text x="95" y="195" class="chip" style="fill:#a8801f;font-size:12px;font-weight:800">1 PAGE · REAL TEXT</text></g>
    </g>
  </g>
  <text x="925" y="352" class="lab" style="fill:#e8d5a6">You review it. Nothing is sent from /apply.</text>
</svg>
