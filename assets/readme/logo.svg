<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="t">
  <title id="t">Internship Hunt logo: a geometric maroon fox with a gold magnifying-glass monocle</title>
  <!-- ears -->
  <polygon points="46,26 86,62 40,90" fill="#7a1f2b"/>
  <polygon points="154,26 114,62 160,90" fill="#7a1f2b"/>
  <polygon points="52,42 74,62 48,78" fill="#4a1119"/>
  <polygon points="148,42 126,62 152,78" fill="#4a1119"/>
  <!-- head -->
  <polygon points="40,72 100,50 160,72 150,122 100,166 50,122" fill="#8c2333"/>
  <polygon points="100,50 160,72 150,122 100,166" fill="#7a1f2b"/>
  <!-- muzzle -->
  <polygon points="58,114 100,104 142,114 100,166" fill="#f3ead8"/>
  <polygon points="100,104 142,114 100,166" fill="#e6d9bf"/>
  <polygon points="92,150 108,150 100,160" fill="#121216"/>
  <!-- eye -->
  <circle cx="76" cy="94" r="6.5" fill="#121216"/>
  <circle cx="78" cy="92" r="2" fill="#f3ead8"/>
  <!-- monocle / magnifier -->
  <circle cx="124" cy="94" r="17" fill="#5b8fd6" fill-opacity=".45"/>
  <circle cx="124" cy="94" r="5.5" fill="#121216"/>
  <circle cx="124" cy="94" r="17" fill="none" stroke="#d4a94a" stroke-width="6"/>
  <line x1="136.5" y1="106.5" x2="162" y2="132" stroke="#d4a94a" stroke-width="8" stroke-linecap="round"/>
  <path d="M114 86 a12 12 0 0 1 8 -4" fill="none" stroke="#f3ead8" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
</svg>
