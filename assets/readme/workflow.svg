<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">The workflow</title>
  <desc id="d">Seven steps in order: /profile-setup builds your profile, /run-search finds and verifies internships, you approve the jobs you want, /apply tailors a resume and cover letter, you approve the exact package, /submit-application and /contact-recruiter send it, and /check-updates watches for replies. A pulse travels along the steps; the two approval steps are marked with a lock.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16233b"/></linearGradient>
    <linearGradient id="ac" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="1110" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <style>
      .cmd{font:700 15px 'Cascadia Code',Consolas,'SF Mono',Menlo,monospace;fill:#e2e8f0;text-anchor:middle}
      .sub{font:400 13px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#94a3b8;text-anchor:middle}
      .gate{font:700 13px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#fbbf24;text-anchor:middle}
      .card{fill:#111c30;stroke:#23324b;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>

  <line x1="90" y1="110" x2="1110" y2="110" stroke="#23324b" stroke-width="3"/>
  <line x1="90" y1="110" x2="1110" y2="110" stroke="url(#ac)" stroke-width="3" pathLength="1" stroke-dasharray="1 1">
    <animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;.8;1" dur="9s" repeatCount="indefinite"/>
  </line>
  <circle r="7" cy="110" fill="#5eead4">
    <animate attributeName="cx" values="90;1110;1110" keyTimes="0;.8;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;.8;.85" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- step template: node at x, lit when the pulse passes (time = (x-90)/1020*0.8) -->
  <g>
    <circle cx="90" cy="110" r="14" fill="#0f1a2e" stroke="#2dd4bf" stroke-width="3"/>
    <text x="90" y="116" text-anchor="middle" font="700 13px sans-serif" fill="#5eead4" style="font:700 13px 'Segoe UI',sans-serif">1</text>
    <rect class="card" x="20" y="150" width="140" height="90" rx="12"/>
    <text x="90" y="182" class="cmd">/profile-setup</text>
    <text x="90" y="204" class="sub">resume + answers</text>
    <text x="90" y="222" class="sub">→ confirmed profile</text>
  </g>
  <g>
    <circle cx="260" cy="110" r="14" fill="#0f1a2e" stroke="#334155" stroke-width="3"><animate attributeName="stroke" values="#334155;#334155;#2dd4bf;#2dd4bf;#334155" keyTimes="0;.133;.14;.95;1" dur="9s" repeatCount="indefinite"/></circle>
    <text x="260" y="116" style="font:700 13px 'Segoe UI',sans-serif" text-anchor="middle" fill="#5eead4">2</text>
    <rect class="card" x="190" y="150" width="140" height="90" rx="12"/>
    <text x="260" y="182" class="cmd">/run-search</text>
    <text x="260" y="204" class="sub">feeds, startups,</text>
    <text x="260" y="222" class="sub">career pages, web</text>
  </g>
  <g>
    <circle cx="430" cy="110" r="16" fill="#1f1a0b" stroke="#fbbf24" stroke-width="3"><animate attributeName="r" values="16;16;21;16;16" keyTimes="0;.266;.29;.32;1" dur="9s" repeatCount="indefinite"/></circle>
    <path d="M424 109 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#fbbf24" stroke-width="2.4"/><rect x="421" y="109" width="18" height="11" rx="2" fill="#fbbf24"/>
    <rect class="card" x="360" y="150" width="140" height="90" rx="12" style="stroke:#fbbf24;stroke-opacity:.5"/>
    <text x="430" y="182" class="gate">YOU APPROVE</text>
    <text x="430" y="204" class="sub">the jobs you want</text>
    <text x="430" y="222" class="sub">(verified first)</text>
  </g>
  <g>
    <circle cx="600" cy="110" r="14" fill="#0f1a2e" stroke="#334155" stroke-width="3"><animate attributeName="stroke" values="#334155;#334155;#2dd4bf;#2dd4bf;#334155" keyTimes="0;.4;.407;.95;1" dur="9s" repeatCount="indefinite"/></circle>
    <text x="600" y="116" style="font:700 13px 'Segoe UI',sans-serif" text-anchor="middle" fill="#5eead4">3</text>
    <rect class="card" x="530" y="150" width="140" height="90" rx="12"/>
    <text x="600" y="182" class="cmd">/apply</text>
    <text x="600" y="204" class="sub">tailored resume,</text>
    <text x="600" y="222" class="sub">cover letter, answers</text>
  </g>
  <g>
    <circle cx="770" cy="110" r="16" fill="#1f1a0b" stroke="#fbbf24" stroke-width="3"><animate attributeName="r" values="16;16;21;16;16" keyTimes="0;.533;.556;.586;1" dur="9s" repeatCount="indefinite"/></circle>
    <path d="M764 109 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#fbbf24" stroke-width="2.4"/><rect x="761" y="109" width="18" height="11" rx="2" fill="#fbbf24"/>
    <rect class="card" x="700" y="150" width="140" height="90" rx="12" style="stroke:#fbbf24;stroke-opacity:.5"/>
    <text x="770" y="182" class="gate">YOU APPROVE</text>
    <text x="770" y="204" class="sub">the exact package</text>
    <text x="770" y="222" class="sub">or message</text>
  </g>
  <g>
    <circle cx="940" cy="110" r="14" fill="#0f1a2e" stroke="#334155" stroke-width="3"><animate attributeName="stroke" values="#334155;#334155;#2dd4bf;#2dd4bf;#334155" keyTimes="0;.666;.673;.95;1" dur="9s" repeatCount="indefinite"/></circle>
    <text x="940" y="116" style="font:700 13px 'Segoe UI',sans-serif" text-anchor="middle" fill="#5eead4">4</text>
    <rect class="card" x="870" y="150" width="140" height="90" rx="12"/>
    <text x="940" y="176" class="cmd" style="font-size:12.5px">/submit-application</text>
    <text x="940" y="196" class="cmd" style="font-size:12.5px">/contact-recruiter</text>
    <text x="940" y="222" class="sub">browser or Gmail</text>
  </g>
  <g>
    <circle cx="1110" cy="110" r="14" fill="#0f1a2e" stroke="#334155" stroke-width="3"><animate attributeName="stroke" values="#334155;#334155;#2dd4bf;#2dd4bf;#334155" keyTimes="0;.8;.807;.95;1" dur="9s" repeatCount="indefinite"/></circle>
    <text x="1110" y="116" style="font:700 13px 'Segoe UI',sans-serif" text-anchor="middle" fill="#5eead4">5</text>
    <rect class="card" x="1040" y="150" width="140" height="90" rx="12"/>
    <text x="1110" y="182" class="cmd">/check-updates</text>
    <text x="1110" y="204" class="sub">replies, interviews,</text>
    <text x="1110" y="222" class="sub">follow-ups</text>
  </g>

  <text x="600" y="52" text-anchor="middle" style="font:700 22px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" fill="#f8fafc">Five commands, two approval gates</text>
  <text x="600" y="276" text-anchor="middle" style="font:400 13px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" fill="#64748b">/job-status and /integrations work at any time: where everything stands, and what is connected</text>
</svg>
